name: Publish bory meal plan

on:
  schedule:
    - cron: "20 22 * * 5"   # 18:20 ET Friday — after the planning run
    - cron: "0 14 * * 6"    # 10:00 ET Saturday — safety net before you shop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Collect and render
        id: relay
        env:
          BORY_OUTBOX: ${{ vars.BORY_OUTBOX }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: python tools/relay.py

      - name: Commit
        if: steps.relay.outputs.published != '0'
        run: |
          git config user.name  "Bory"
          git config user.email "bory@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "publish: $(date -u +%Y-%m-%d)"
          git push
